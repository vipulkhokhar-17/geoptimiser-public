name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the classifiers in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate release helper syntax
        run: bash -n scripts/create_clean_release_repo.sh

      - name: Tests
        run: python -m pytest

  agent:
    name: Agent and API extras (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and security auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,agent,api]' httpx pip-audit

      - name: Audit installed Python dependencies
        run: pip-audit

      - name: Audit optional web and semantic dependency trees
        run: |
          cat > "$RUNNER_TEMP/geoptimiser-optional-requirements.txt" <<'EOF'
          sentence-transformers>=3.0
          httpx>=0.27
          beautifulsoup4>=4.12
          trafilatura>=2.0
          python-dotenv>=1.0
          EOF
          pip-audit -r "$RUNNER_TEMP/geoptimiser-optional-requirements.txt"

      - name: Agent and application tests
        run: python -m pytest -W error tests/agent tests/app -rs

      - name: Reproducible demo (offline, fake model)
        run: python -m geoptimiser.demo --out "$RUNNER_TEMP/demo" --force
